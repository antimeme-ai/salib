[package]
name = "salib-surrogate"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = """
Surrogate models for sensitivity analysis: Polynomial Chaos Expansion
(PCE) with sparse LARS, analytic Sobol' indices, and active subspaces.
"""

[lib]
path = "src/lib.rs"

[dependencies]
salib-core = { version = "0.1.0", path = "../salib-core" }
# `nalgebra` for OLS via Cholesky in `pce::fit_full_pce`. Already
# in the workspace dep graph transitively via statrs.
nalgebra = "0.33"
# `ndarray` for `(N, d)` sample matrix shape.
ndarray = "0.16"
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde", "ndarray/serde"]

[dev-dependencies]
# For end-to-end Ishigami contract close at PR 16b: Sobol' QMC base
# samples + canonical Ishigami fixture + Gherkin step harness.
# `finite_difference_gradients` helper.
salib-estimators = { version = "0.1.0", path = "../salib-estimators" }
salib-samplers = { version = "0.1.0", path = "../salib-samplers" }
salib-validation = { version = "0.1.0", path = "../salib-validation" }
salib-tck = { version = "0.1.0", path = "../salib-tck" }
serde_json = "1"

[lints]
workspace = true
