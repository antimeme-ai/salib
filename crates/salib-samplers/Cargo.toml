[package]
name = "salib-samplers"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = """
Sampling designs for global sensitivity analysis: LHS, Sobol' QMC,
Halton, Saltelli (A, B, A_Bi), Morris trajectories, FAST/eFAST/RBD-FAST.
"""

[lib]
path = "src/lib.rs"

[dependencies]
salib-core = { version = "0.1.0", path = "../salib-core" }

# Sample matrices live in `ndarray::Array2<f64>` row-major. Per
# canonical math storage; salib-samplers is the inflection point
# where it enters the dep graph.
ndarray = "0.16"

# Underlying RNG for permutations and offsets; routed through
# `RngState::into_chacha`.
rand = { version = "0.9", default-features = false }
rand_chacha = { version = "0.9", default-features = false }

# `Sampler::config_hash` — SHA-256 over canonical JSON of the
# sampler config. Same posture as `Problem::content_hash`
sha2 = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `SaltelliError` — fallible `build_saltelli_matrix`.
thiserror = "2"

[dev-dependencies]
# Outer Gherkin TCK harness.
salib-tck = { version = "0.1.0", path = "../salib-tck" }

[lints]
workspace = true
