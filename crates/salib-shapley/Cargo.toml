[package]
name = "salib-shapley"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = """
Shapley effects estimator for global sensitivity analysis
(Song-Nelson-Staum 2016).
"""

[lib]
path = "src/lib.rs"

[dependencies]
salib-core = { version = "0.1.1", path = "../salib-core" }
rand = { version = "0.9", default-features = false }
rand_chacha = { version = "0.9", default-features = false }
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
salib-validation = { version = "0.1.1", path = "../salib-validation" }
salib-tck = { version = "0.1.1", path = "../salib-tck" }
serde_json = "1"

[lints]
workspace = true
